<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<title>Oriol Vilaró Roca — Portfolio</title>
<script>
(function () {
  var supported = ['en', 'ca', 'es'];
  var code = null;
  try { code = localStorage.getItem('portfolio-lang'); } catch (e) {}
  if (supported.indexOf(code) === -1) {
    code = null;
    var langs = navigator.languages || [navigator.language || 'en'];
    for (var i = 0; i < langs.length; i++) {
      var c = String(langs[i]).toLowerCase().split('-')[0];
      if (supported.indexOf(c) !== -1) { code = c; break; }
    }
  }
  location.replace('./' + (code || 'en') + '/');
})();
</script>
</head>
<body>
<p><a href="./en/">English</a> · <a href="./ca/">Català</a> · <a href="./es/">Español</a></p>
</body>
</html>
